name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the hardware toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog verilator yosys python3-venv
          echo "iverilog: $(iverilog -V | head -1)"
          echo "verilator: $(verilator --version)"
          echo "yosys: $(yosys -V)"

      - name: Python environment
        run: make venv

      - name: Lint
        run: |
          make lint
          make lint-config

      - name: Test
        run: make test JOBS=4

      - name: Synthesis
        run: make synth

      - name: Confirm the committed synthesis report is up to date
        run: |
          git --no-pager diff --stat -- docs/synth_report.txt
          if ! git diff --quiet -- docs/synth_report.txt; then
            echo "docs/synth_report.txt differs from the freshly generated one"
            git --no-pager diff -- docs/synth_report.txt
            exit 1
          fi

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            docs/synth_report.txt
            synth/yosys.log
            synth/stat_flat.txt
          if-no-files-found: warn
