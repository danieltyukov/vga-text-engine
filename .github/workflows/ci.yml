name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the hardware toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog verilator yosys python3-venv
          echo "iverilog: $(iverilog -V | head -1)"
          echo "verilator: $(verilator --version)"
          echo "yosys: $(yosys -V)"

      - name: Python environment
        run: make venv

      - name: Lint
        run: |
          make lint
          make lint-config

      - name: Test
        run: make test JOBS=4

      # The IHP PDK, OpenROAD and OpenSTA are not available on a plain GitHub runner, so
      # the silicon flow is a local target. Everything it produces is committed:
      # docs/pdk_area_report.txt, docs/sta_report.txt and the two charts in docs/img.

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            docs/pdk_area_report.txt
            docs/sta_report.txt
          if-no-files-found: warn
