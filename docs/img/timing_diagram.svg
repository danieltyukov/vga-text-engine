  </defs>
  <rect width="1180" height="524" fill="#f8fafc"/>
  <text x="28" y="38" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="21" fill="#111827" text-anchor="start" font-weight="bold" font-style="normal">One horizontal line</text>
  <text x="28" y="62" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" text-anchor="start" font-weight="normal" font-style="normal">640x480@60, 25.175 MHz pixel clock, h_total = 800 pixel clocks = 31.78 us</text>
  <text x="28" y="84" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="start" font-weight="normal" font-style="normal">The engine walks a line SYNC, BACK PORCH, ACTIVE, FRONT PORCH, so the whole blanking gap before active video is one contiguous run.</text>
  <rect x="112.0" y="104" width="121.9" height="26" fill="#fecaca" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="172.96" y="122" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold" font-style="normal">SYNC  96</text>
  <rect x="233.9" y="104" width="61.0" height="26" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
