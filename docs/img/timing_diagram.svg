  <text x="96" y="198" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-style="normal">active low</text>
  <path d="M112,286 L294.9,286 L294.9,250 L1107.7,250 L1107.7,286 L1128,286" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
