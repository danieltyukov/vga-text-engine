  <rect x="1107.7" y="338" width="20.3" height="40" fill="#1f2937" stroke="#4b5563" stroke-width="1.2"/>
  <text x="96" y="358" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#111827" text-anchor="end" font-weight="bold" font-style="normal">R G B</text>
  <text x="96" y="376" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="end" font-weight="normal" font-style="normal">black when !de</text>
  <text x="701.28" y="364" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#111827" text-anchor="middle" font-weight="normal" font-style="normal">640 pixels, one palette lookup each</text>
  <rect x="284.7" y="101" width="10.2" height="282" fill="#7c3aed" fill-opacity="0.20" stroke="#7c3aed" stroke-width="1.4"/>
  <path d="M380.72,500 L306.72,500 L287.72,390" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="390.72" y="504" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="normal" font-style="normal">8 pixel character prefetch window: the pipeline pulls one cell out of the elastic buffer and turns it into a glyph row here</text>
  </svg>
