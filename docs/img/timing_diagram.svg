  <line x1="1107.7" y1="104" x2="1107.7" y2="416" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="1107.68" y="434" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-style="normal">784</text>
  <line x1="1128.0" y1="104" x2="1128.0" y2="416" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="1128.0" y="452" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-style="normal">800</text>
  <text x="620.0" y="476" font-family="ui-sans-serif, 'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="normal" font-style="normal">position within the line, in pixel clocks</text>
  <path d="M112,194 L233.9,194 L233.9,158 L1128,158" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
