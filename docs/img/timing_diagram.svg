  <rect x="1107.7" y="104" width="20.3" height="26" fill="#fde68a" stroke="#a16207" stroke-width="1.4"/>
  <text x="1128.0" y="97" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#a16207" text-anchor="end" font-weight="bold" font-style="normal">FRONT PORCH 16</text>
  <line x1="112.0" y1="104" x2="112.0" y2="416" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="112.0" y="434" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#4b5563" text-anchor="middle" font-weight="normal" font-style="normal">0</text>
  <line x1="233.9" y1="104" x2="233.9" y2="416" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
