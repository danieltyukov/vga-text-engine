<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 524" width="1180" height="524" role="img" aria-label="one horizontal line of timing">
  <defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  <linearGradient id="rgbband" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0.00" stop-color="#f87171"/>
  <stop offset="0.20" stop-color="#fbbf24"/>
  <stop offset="0.40" stop-color="#4ade80"/>
  <stop offset="0.60" stop-color="#38bdf8"/>
  <stop offset="0.80" stop-color="#a78bfa"/>
  <stop offset="1.00" stop-color="#f472b6"/>
